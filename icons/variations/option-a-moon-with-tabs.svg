<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="moonA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#bgA)"/>

  <!-- Subtle inner highlight -->
  <rect x="2" y="2" width="124" height="124" rx="26" ry="26" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Soft glow behind moon -->
  <circle cx="64" cy="64" r="44" fill="rgba(139, 92, 246, 0.3)" filter="url(#glowA)"/>

  <!-- Crescent moon -->
  <g transform="translate(64 64)">
    <path d="M -8 -28
             A 30 30 0 1 0 -8 28
             A 22 22 0 1 1 -8 -28 Z"
          fill="url(#moonA)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="0.5"/>
  </g>

  <!-- Tab strip inside the moon's belly (3 stacked bars hint) -->
  <g transform="translate(64 64)">
    <rect x="-12" y="-3" width="24" height="3.5" rx="1.75" fill="rgba(76, 29, 149, 0.55)"/>
    <rect x="-10" y="4"  width="20" height="3.5" rx="1.75" fill="rgba(76, 29, 149, 0.4)"/>
    <rect x="-8"  y="11" width="16" height="3.5" rx="1.75" fill="rgba(76, 29, 149, 0.3)"/>
  </g>
</svg>
