<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Page background -->
  <rect width="960" height="600" fill="url(#page)"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Tab Hibernator Pro — Icon Variations</text>
  <text x="480" y="64" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Compare at full size (128px), toolbar size (48px), and favicon size (16px)</text>

  <!-- Option A -->
  <g transform="translate(40 110)">
    <text x="120" y="-8" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Option A</text>
    <text x="120" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Moon + tab hint</text>

    <!-- 128 -->
    <g transform="translate(56 30)">
      <rect x="-64" y="-64" width="128" height="128" rx="28" ry="28" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
      <g transform="scale(1)">
        <svg x="-64" y="-64" width="128" height="128" viewBox="0 0 128 128">
          <defs>
            <linearGradient id="bga1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
            <linearGradient id="moona1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/></linearGradient>
          </defs>
          <rect width="128" height="128" rx="28" ry="28" fill="url(#bga1)"/>
          <g transform="translate(64 64)">
            <path d="M -8 -28 A 30 30 0 1 0 -8 28 A 22 22 0 1 1 -8 -28 Z" fill="url(#moona1)"/>
            <rect x="-12" y="-3" width="24" height="3.5" rx="1.75" fill="rgba(76,29,149,0.55)"/>
            <rect x="-10" y="4" width="20" height="3.5" rx="1.75" fill="rgba(76,29,149,0.4)"/>
            <rect x="-8" y="11" width="16" height="3.5" rx="1.75" fill="rgba(76,29,149,0.3)"/>
          </g>
        </svg>
      </g>
    </g>

    <!-- 48 -->
    <g transform="translate(220 78)">
      <text x="24" y="-32" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">48px</text>
      <rect x="-2" y="-2" width="52" height="52" rx="11" ry="11" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>
      <svg width="48" height="48" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="bga2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
          <linearGradient id="moona2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/></linearGradient>
        </defs>
        <rect width="128" height="128" rx="28" ry="28" fill="url(#bga2)"/>
        <g transform="translate(64 64)">
          <path d="M -8 -28 A 30 30 0 1 0 -8 28 A 22 22 0 1 1 -8 -28 Z" fill="url(#moona2)"/>
          <rect x="-12" y="-3" width="24" height="3.5" rx="1.75" fill="rgba(76,29,149,0.55)"/>
          <rect x="-10" y="4" width="20" height="3.5" rx="1.75" fill="rgba(76,29,149,0.4)"/>
          <rect x="-8" y="11" width="16" height="3.5" rx="1.75" fill="rgba(76,29,149,0.3)"/>
        </g>
      </svg>
    </g>

    <!-- 16 -->
    <g transform="translate(290 94)">
      <text x="8" y="-16" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">16px</text>
      <rect x="-2" y="-2" width="20" height="20" rx="4" ry="4" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>
      <svg width="16" height="16" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="bga3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
          <linearGradient id="moona3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/></linearGradient>
        </defs>
        <rect width="128" height="128" rx="28" ry="28" fill="url(#bga3)"/>
        <g transform="translate(64 64)">
          <path d="M -8 -28 A 30 30 0 1 0 -8 28 A 22 22 0 1 1 -8 -28 Z" fill="url(#moona2)"/>
        </g>
      </svg>
    </g>
  </g>

  <!-- Option B -->
  <g transform="translate(360 110)">
    <text x="120" y="-8" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Option B</text>
    <text x="120" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Premium crescent (dark)</text>

    <g transform="translate(56 30)">
      <rect x="-64" y="-64" width="128" height="128" rx="28" ry="28" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
      <svg x="-64" y="-64" width="128" height="128" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="bgb1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a1f"/></linearGradient>
          <linearGradient id="moonb1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#a5b4fc"/></linearGradient>
        </defs>
        <rect width="128" height="128" rx="28" ry="28" fill="url(#bgb1)"/>
        <circle cx="22" cy="28" r="0.8" fill="rgba(255,255,255,0.5)"/>
        <circle cx="100" cy="22" r="0.6" fill="rgba(255,255,255,0.4)"/>
        <circle cx="108" cy="92" r="0.7" fill="rgba(255,255,255,0.5)"/>
        <circle cx="18" cy="98" r="0.5" fill="rgba(255,255,255,0.4)"/>
        <g transform="translate(64 64)">
          <path d="M -6 -32 A 34 34 0 1 0 -6 32 A 26 26 0 1 1 -6 -32 Z" fill="url(#moonb1)"/>
        </g>
      </svg>
    </g>

    <g transform="translate(220 78)">
      <text x="24" y="-32" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">48px</text>
      <rect x="-2" y="-2" width="52" height="52" rx="11" ry="11" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>
      <svg width="48" height="48" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="bgb2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a1f"/></linearGradient>
          <linearGradient id="moonb2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#a5b4fc"/></linearGradient>
        </defs>
        <rect width="128" height="128" rx="28" ry="28" fill="url(#bgb2)"/>
        <g transform="translate(64 64)">
          <path d="M -6 -32 A 34 34 0 1 0 -6 32 A 26 26 0 1 1 -6 -32 Z" fill="url(#moonb2)"/>
        </g>
      </svg>
    </g>

    <g transform="translate(290 94)">
      <text x="8" y="-16" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">16px</text>
      <rect x="-2" y="-2" width="20" height="20" rx="4" ry="4" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>
      <svg width="16" height="16" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="bgb3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f0a1f"/></linearGradient>
          <linearGradient id="moonb3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#a5b4fc"/></linearGradient>
        </defs>
        <rect width="128" height="128" rx="28" ry="28" fill="url(#bgb3)"/>
        <g transform="translate(64 64)">
          <path d="M -6 -32 A 34 34 0 1 0 -6 32 A 26 26 0 1 1 -6 -32 Z" fill="url(#moonb3)"/>
        </g>
      </svg>
    </g>
  </g>

  <!-- Option C -->
  <g transform="translate(680 110)">
    <text x="120" y="-8" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Option C</text>
    <text x="120" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Stacked tabs (modern)</text>

    <g transform="translate(56 30)">
      <rect x="-64" y="-64" width="128" height="128" rx="28" ry="28" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
      <svg x="-64" y="-64" width="128" height="128" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="bgc1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
          <linearGradient id="tabc11" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
          <linearGradient id="tabc12" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#c7d2fe"/><stop offset="100%" stop-color="#a5b4fc"/></linearGradient>
          <linearGradient id="tabc13" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
        </defs>
        <rect width="128" height="128" rx="28" ry="28" fill="url(#bgc1)"/>
        <g transform="translate(64 64)">
          <g transform="rotate(-8)">
            <rect x="-32" y="-6" width="64" height="48" rx="8" ry="8" fill="url(#tabc13)" opacity="0.55"/>
          </g>
          <g transform="rotate(2)">
            <rect x="-34" y="-12" width="68" height="52" rx="8" ry="8" fill="url(#tabc12)"/>
          </g>
          <g transform="rotate(10)">
            <rect x="-36" y="-18" width="72" height="56" rx="9" ry="9" fill="url(#tabc11)"/>
            <g transform="translate(12 12)" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M -4 -4 L 4 -4 L -4 4 L 4 4"/>
            </g>
          </g>
        </g>
      </svg>
    </g>

    <g transform="translate(220 78)">
      <text x="24" y="-32" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">48px</text>
      <rect x="-2" y="-2" width="52" height="52" rx="11" ry="11" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>
      <svg width="48" height="48" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="bgc2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
          <linearGradient id="tabc21" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
          <linearGradient id="tabc22" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#c7d2fe"/><stop offset="100%" stop-color="#a5b4fc"/></linearGradient>
        </defs>
        <rect width="128" height="128" rx="28" ry="28" fill="url(#bgc2)"/>
        <g transform="translate(64 64)">
          <g transform="rotate(-8)">
            <rect x="-32" y="-6" width="64" height="48" rx="8" ry="8" fill="url(#tabc22)" opacity="0.55"/>
          </g>
          <g transform="rotate(10)">
            <rect x="-36" y="-18" width="72" height="56" rx="9" ry="9" fill="url(#tabc21)"/>
          </g>
        </g>
      </svg>
    </g>

    <g transform="translate(290 94)">
      <text x="8" y="-16" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">16px</text>
      <rect x="-2" y="-2" width="20" height="20" rx="4" ry="4" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>
      <svg width="16" height="16" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="bgc3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
          <linearGradient id="tabc31" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
        </defs>
        <rect width="128" height="128" rx="28" ry="28" fill="url(#bgc3)"/>
        <g transform="translate(64 64)">
          <rect x="-32" y="-22" width="64" height="44" rx="8" ry="8" fill="url(#tabc31)"/>
        </g>
      </svg>
    </g>
  </g>

  <!-- Pros / cons at the bottom -->
  <g transform="translate(40 360)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">A — Moon + tab hint</text>
    <text x="0" y="20" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Keeps the cozy "sleep" metaphor, adds subtle tab bars inside the moon.</text>
    <text x="0" y="36" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Reads as: "your browser is sleeping." Familiar, friendly, on-brand for the Pro feel.</text>
  </g>
  <g transform="translate(360 360)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">B — Premium crescent (dark)</text>
    <text x="0" y="20" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Sophisticated dark mode, subtle starfield, "do not disturb" energy.</text>
    <text x="0" y="36" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Reads as: "premium night-mode tool." High-end, but loses the "browser" hint entirely.</text>
  </g>
  <g transform="translate(680 360)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">C — Stacked tabs (modern)</text>
    <text x="0" y="20" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Drops the moon, embraces "tabs" as the hero. Front tab has a tiny "Z" sleep mark.</text>
    <text x="0" y="36" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Reads as: "tab manager that sleeps tabs." Most distinctive, most contextually on-target.</text>
  </g>

  <!-- Footer recommendation -->
  <g transform="translate(40 520)">
    <rect x="0" y="0" width="880" height="48" rx="10" ry="10" fill="#1e1b4b" opacity="0.05"/>
    <text x="20" y="30" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e1b4b">Tip: Open this SVG in a browser to zoom in and inspect each at true size, then export the one you like to PNG at 16/48/128.</text>
  </g>
</svg>
