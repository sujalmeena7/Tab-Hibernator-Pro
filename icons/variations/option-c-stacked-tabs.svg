<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="tabC1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="tabC2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="tabC3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#bgC)"/>

  <!-- Soft inner highlight -->
  <rect x="2" y="2" width="124" height="124" rx="26" ry="26" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Stacked tabs (back to front, each rotated slightly) -->
  <g transform="translate(64 64)">
    <!-- Back tab (dimmed/hibernated) -->
    <g transform="rotate(-8)">
      <rect x="-32" y="-6" width="64" height="48" rx="8" ry="8" fill="url(#tabC3)" opacity="0.55"/>
      <circle cx="-20" cy="6" r="2" fill="rgba(255,255,255,0.5)"/>
      <rect x="-12" y="4" width="30" height="4" rx="2" fill="rgba(255,255,255,0.5)"/>
    </g>

    <!-- Middle tab -->
    <g transform="rotate(2)">
      <rect x="-34" y="-12" width="68" height="52" rx="8" ry="8" fill="url(#tabC2)"/>
      <circle cx="-22" cy="2" r="2.2" fill="rgba(255,255,255,0.7)"/>
      <rect x="-14" y="0" width="32" height="4" rx="2" fill="rgba(255,255,255,0.7)"/>
    </g>

    <!-- Front tab (active, with ZZZ on it) -->
    <g transform="rotate(10)">
      <rect x="-36" y="-18" width="72" height="56" rx="9" ry="9" fill="url(#tabC1)"/>
      <circle cx="-23" cy="-2" r="2.5" fill="#8b5cf6"/>
      <rect x="-15" y="-4" width="34" height="4" rx="2" fill="#cbd5e1"/>
      <!-- Mini Z (sleeping) -->
      <g transform="translate(12 12)" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M -4 -4 L 4 -4 L -4 4 L 4 4"/>
      </g>
    </g>
  </g>
</svg>
