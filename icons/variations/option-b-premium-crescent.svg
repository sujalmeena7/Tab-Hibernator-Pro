<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0a1f"/>
    </linearGradient>
    <linearGradient id="moonB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="ringB" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="rgba(139, 92, 246, 0)"/>
      <stop offset="85%" stop-color="rgba(139, 92, 246, 0.3)"/>
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0)"/>
    </radialGradient>
  </defs>

  <!-- Dark squircle background -->
  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="url(#bgB)"/>

  <!-- Subtle starfield -->
  <circle cx="22" cy="28" r="0.8" fill="rgba(255,255,255,0.5)"/>
  <circle cx="100" cy="22" r="0.6" fill="rgba(255,255,255,0.4)"/>
  <circle cx="108" cy="92" r="0.7" fill="rgba(255,255,255,0.5)"/>
  <circle cx="18" cy="98" r="0.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="92" cy="50" r="0.4" fill="rgba(255,255,255,0.3)"/>
  <circle cx="32" cy="60" r="0.4" fill="rgba(255,255,255,0.3)"/>

  <!-- DND glow ring -->
  <circle cx="64" cy="64" r="50" fill="url(#ringB)"/>

  <!-- Crescent moon (centered, slightly larger) -->
  <g transform="translate(64 64)">
    <path d="M -6 -32
             A 34 34 0 1 0 -6 32
             A 26 26 0 1 1 -6 -32 Z"
          fill="url(#moonB)"/>
    <!-- Subtle inner highlight on moon -->
    <path d="M -6 -32
             A 34 34 0 0 0 -30 0
             A 34 34 0 0 0 -22 -22
             A 28 28 0 0 1 -6 -32 Z"
          fill="rgba(255,255,255,0.25)"/>
  </g>
</svg>
